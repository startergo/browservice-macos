<html>
<head>
<title>%-programName-%</title>
<meta http-equiv="imagetoolbar" content="no">
<style>
body {
    overflow-x: hidden;
}
img {
    position: absolute;
    top: 0px;
    left: 0px;
}
iframe {
    display: none;
    position: absolute;
    z-index: 1;
}
input {
    position: absolute;
    z-index: 1;
    left: -50px;
    top: -50px;
    width: 40px;
    height: 40px;
}
.handCursor {
    cursor: pointer;
    cursor: hand;
}
.normalCursor {
    cursor: default;
}
.textCursor {
    cursor: text;
}
</style>
<script type="text/javascript">

// Configuration constants
var imgLoadRetryInterval = 3000;
var imgLoadMaxRetries = 10;
var minIframeLoadInterval = 2000;
var eventDelay = 10;

// Browser quirks
var useOnDOMMouseScroll = false;
var useOnMouseWheel = false;
var fixMousePosition = false;
var leftMouseButtonIs1 = false;
var bodyOverflowHiddenNotSupported = false;
var useBackspaceCaptureHack = false;

function detectBrowserQuirks() {
    var ua = window.navigator.userAgent.toLowerCase();
    if(ua.indexOf("chrome") != -1 || ua.indexOf("chromium") != -1) {
        useOnMouseWheel = true;
    }
    if(ua.indexOf("firefox") != -1 || ua.indexOf("gecko") != -1) {
        useOnDOMMouseScroll = true;
    }
    if(ua.indexOf("classilla") != -1) {
        bodyOverflowHiddenNotSupported = true;
    }
    var msie = ua.indexOf("msie ");
    if(msie > 0) {
        var ver = parseInt(ua.substring(msie + 5, ua.indexOf(".", msie)), 10);
        var win16Bit =
            ua.indexOf("windows 3.1") != -1 ||
            ua.indexOf("win16") != -1 ||
            ua.indexOf("windows 16-bit") != -1;
        useOnMouseWheel = true;
        if(ver <= 8) {
            fixMousePosition = true;
            leftMouseButtonIs1 = true;
        }
        if(ver <= 4 || (ver == 5 && win16Bit)) {
            bodyOverflowHiddenNotSupported = true;
            useBackspaceCaptureHack = true;
        }
    }
}

// State variables
var shutdown = false;

var eventQueue = new Array();
var eventQueueStartIdx = 0;

// WebSocket state
var ws = null;
var wsMode = false;
var wsImgLoadIdx = 0;
var lastBlobUrl = null;

var mouseMoved = false;
var mouseX = 0;
var mouseY = 0;

// Last known viewport dimensions (set during image requests, used by onscroll)
var lastVpWidth = 1;
var lastVpHeight = 1;

// Scrollbar state — only used when !bodyOverflowHiddenNotSupported
var scrollbarY = 0;           // current scrollbar position (0–~99000)
var scrollbarProgrammatic = false;  // true while a programmatic scrollTo is in flight
var dragSpringTimeout = null; // debounced edge-spring for scrollbar drags

// Timestamp of the most recent DOMMouseScroll event.  Used by onscroll to
// detect the Camino duplicate: native scroll fires first, then DOMMouseScroll
// follows for the same gesture.  If onscroll sees a recent DOMMouseScroll, it
// suppresses its own MWH (DOMMouseScroll already sent the proper one).
var lastDOMMouseScrollTime = 0;

// ── Tile-layer state (WebSocket tile-push mode) ──────────────────────────────
// When the server sends dirty-tile frames instead of full JPEGs, we maintain a
// grid of <img> elements (one per 128×128 tile) inside a scrolling <div>.
var tileLayer = null;    // <div> container for all tile <img> elements
var tileImgs = {};       // map "x_y" → {elem:<img>, url:string|null}
var wsTileMode = false;  // true once the first tiles message is received

function ensureTileImg(x, y, w, h) {
    var key = x + "_" + y;
    if(!tileImgs[key]) {
        var img = document.createElement("img");
        img.style.position = "absolute";
        img.style.left = x + "px";
        img.style.top  = y + "px";
        img.width  = w;
        img.height = h;
        tileLayer.appendChild(img);
        tileImgs[key] = {elem: img, url: null};
    }
    return tileImgs[key];
}

// Parse the binary payload sent by sendTileFrame().
// Each tile: [u16 x][u16 y][u16 w][u16 h][u32 jpeg_len][jpeg_data] (big-endian).
function parseTileBinary(ab, count) {
    var arr = new Uint8Array(ab);
    var pos = 0;
    var tiles = [];
    for(var i = 0; i < count; i++) {
        var x = (arr[pos]<<8)|arr[pos+1]; pos+=2;
        var y = (arr[pos]<<8)|arr[pos+1]; pos+=2;
        var w = (arr[pos]<<8)|arr[pos+1]; pos+=2;
        var h = (arr[pos]<<8)|arr[pos+1]; pos+=2;
        var len = ((arr[pos]<<24)|(arr[pos+1]<<16)|(arr[pos+2]<<8)|arr[pos+3])>>>0; pos+=4;
        tiles.push({x:x, y:y, w:w, h:h, buf: ab.slice(pos, pos+len)});
        pos += len;
    }
    return tiles;
}

// Apply a list of parsed tile updates to the tile-layer grid.
function applyTiles(tiles) {
    for(var i = 0; i < tiles.length; i++) {
        var t = tiles[i];
        var ti = ensureTileImg(t.x, t.y, t.w, t.h);
        var newUrl = URL.createObjectURL(new Blob([t.buf], {type:"image/jpeg"}));
        var oldUrl = ti.url;
        ti.url = newUrl;
        ti.elem.src = newUrl;
        // Revoke the previous blob URL once the new tile has loaded.
        (function(u) {
            ti.elem.onload = function() { if(u) URL.revokeObjectURL(u); };
        })(oldUrl);
    }
}

// Move the tile layer to match the current scroll position.
function setTileLayerTop(y) {
    if(tileLayer) tileLayer.style.top = y + "px";
}

// Called after every MWH event so the scrollbar tracks all scroll sources
// (trackpad gestures, mouse wheel, scrollbar drag already handled by onscroll).
// Auto-resets near the edges so continuous/infinite-scroll pages never stall.
function applyMWHToScrollbar(delta) {
    if(bodyOverflowHiddenNotSupported || !imgElems[0]) return;
    // scrollbarY is the pre-native-position when onscroll deferred (Camino
    // trackpad), so newY is computed from the correct base regardless of
    // whether a native scroll also fired for this gesture tick.
    var newY = (scrollbarY - (delta | 0)) | 0;
    newY = Math.max(0, Math.min(99000, newY));
    // Spring to midpoint near either edge so the scrollbar never stalls on
    // long pages.  Dragging back to 0 snaps CEF to the top (see below),
    // so the spring does not prevent returning to the page top.
    if(newY > 90000 || newY < 10000) newY = 50000;
    if(newY === scrollbarY) return;
    scrollbarProgrammatic = true;
    scrollbarY = newY;
    if(wsTileMode) {
        setTileLayerTop(newY);
    } else {
        imgElems[0].style.top = newY + "px";
        imgElems[1].style.top = newY + "px";
    }
    window.scrollTo(0, newY);
    // Snap CEF to the page top when the thumb returns to position 0.
    // This corrects any accumulated drift (scroll restoration, double-scroll
    // in IE, wheel events past the spacer limit, etc.).  CEF clamps safely.
    if(newY === 0) {
        var snapCx = (lastVpWidth / 2) | 0;
        var snapCy = (lastVpHeight / 2) | 0;
        putEvent("MWH_" + snapCx + "_" + snapCy + "_999999");
    }
}

// Reset the scrollbar to the top (called on navigation to a new page).
function resetScrollbar() {
    if(bodyOverflowHiddenNotSupported || !imgElems[0]) return;
    scrollbarProgrammatic = true;
    scrollbarY = 0;
    if(wsTileMode) {
        setTileLayerTop(0);
    } else {
        imgElems[0].style.top = "0px";
        imgElems[1].style.top = "0px";
    }
    window.scrollTo(0, 0);
}

// Called when CEF signals that it hit the top or bottom edge (scroll stuck).
// Springs the scrollbar back to the midpoint so the user can keep scrolling.
var lastScrollStuck = false;
function handleScrollStuck(stuck) {
    if(bodyOverflowHiddenNotSupported || stuck === lastScrollStuck) return;
    lastScrollStuck = stuck;
    if(!stuck) return;
    // CEF hit an edge — re-centre the scrollbar so the user can scroll back.
    scrollbarProgrammatic = true;
    scrollbarY = 50000;
    if(wsTileMode) {
        setTileLayerTop(50000);
    } else {
        imgElems[0].style.top = "50000px";
        imgElems[1].style.top = "50000px";
    }
    window.scrollTo(0, 50000);
}

// Iframe loading system
var nextAllowedIframeLoadTime = new Date().getTime();
var nextIframeLoadIdx = 1;
var schedIframeLoadIdx = null;
var iframeLoadTimeout = null;
var iframeElemIdx = 0;

function iframeLoadHandler(iframeLoadIdx) {
    if(shutdown || iframeLoadIdx != schedIframeLoadIdx) return;

    schedIframeLoadIdx = null;

    nextAllowedIframeLoadTime = new Date().getTime() + minIframeLoadInterval;

    ++iframeElemIdx;
    if(iframeElemIdx >= document.forms.length - 1) {
        iframeElemIdx = 0;
    }

    var rand = (1e9 * Math.random()) | 0;
    document.forms[iframeElemIdx].innerHTML =
        "<iframe src=\"%-pathPrefix-%/iframe/%-mainIdx-%/" + rand + "/\"></iframe>";
}

function loadIframe() {
    if(shutdown || schedIframeLoadIdx != null) return;

    schedIframeLoadIdx = nextIframeLoadIdx++;
    iframeLoadTimeout = setTimeout(
        "iframeLoadHandler(" + schedIframeLoadIdx + ")",
        Math.max(nextAllowedIframeLoadTime - new Date().getTime(), 0)
    );
}

function cancelIframeLoad() {
    if(shutdown || schedIframeLoadIdx == null) return;

    schedIframeLoadIdx = null;
    clearTimeout(iframeLoadTimeout);
}

// Image loading loop
var imgElems = new Array();
var imgElemClass = new Array();
imgElemClass[0] = null;
imgElemClass[1] = null;

var currentImgLoadIdx = 0;
var imgReqIdx = 0;
var imgLoadEventIncrement;
var firstImgReqSent;
var imgLoadAttempts;
var currentImgReloadIdx;
var allowNewEventNotify;
var postImgLoadHandlerSchedIdx = null;
var imgReloadTimeout = null;

function scheduleImgReload(imgLoadIdx, delay) {
    if(shutdown || imgLoadIdx != currentImgLoadIdx) return;

    if(imgReloadTimeout) {
        clearTimeout(imgReloadTimeout);
        imgReloadTimeout = null;
    }

    var imgReloadIdx = ++currentImgReloadIdx;
    setTimeout(
        "imgReloadTimeoutComplete(" + imgLoadIdx + ", " + imgReloadIdx + ")",
        delay
    );
}

function newEventNotify() {
    if(shutdown || currentImgLoadIdx == 0 || !allowNewEventNotify) return;
    allowNewEventNotify = false;

    imgLoadAttempts = Math.max(imgLoadAttempts - 1, 0);

    scheduleImgReload(currentImgLoadIdx, eventDelay);
}

function sendImgReq(imgLoadIdx) {
    if(shutdown || imgLoadIdx != currentImgLoadIdx) return;

    if(imgLoadAttempts > imgLoadMaxRetries) {
        document.title = "%-programName-%: Connection lost";
        window.status = "%-programName-%: Connection lost";
        shutdown = true;
        return;
    }
    ++imgLoadAttempts;

    if(mouseMoved) {
        eventQueue[eventQueue.length] = "MMO_" + mouseX + "_" + mouseY;
        mouseMoved = false;
    }

    // Use stored viewport dimensions (measured before spacer was added)
    var width = lastVpWidth;
    var height = lastVpHeight;

    var immediate = ((firstImgReqSent || imgReqIdx == 0) ? 1 : 0);
    firstImgReqSent = true;

    var imgPath =
        "%-pathPrefix-%/image/" +
        "%-mainIdx-%/" +
        (++imgReqIdx) + "/" +
        immediate + "/" +
        width + "/" +
        height + "/" +
        eventQueueStartIdx + "/";
    for(var i = 0; i < eventQueue.length; ++i) {
        imgPath += eventQueue[i] + "/";
    }
    imgElems[imgLoadIdx & 1].src = imgPath;

    scheduleImgReload(imgLoadIdx, imgLoadRetryInterval);
}

function imgReloadTimeoutComplete(imgLoadIdx, imgReloadIdx) {
    if(
        shutdown ||
        imgLoadIdx != currentImgLoadIdx ||
        imgReloadIdx != currentImgReloadIdx
    ) return;

    imgReloadTimeout = null;
    sendImgReq(imgLoadIdx);
}

function startImgLoad() {
    if(shutdown) return;

    var imgLoadIdx = ++currentImgLoadIdx;

    imgLoadEventIncrement = eventQueue.length;
    firstImgReqSent = false;
    imgLoadAttempts = 0;
    currentImgReloadIdx = 0;
    allowNewEventNotify = true;

    sendImgReq(imgLoadIdx);
}

function updateCursor(imgElemIdx) {
    if(shutdown) return;

    // Height encoding: % 6 = cursor(0-2) + 3 * scroll_stuck(0-1).
    // cursor = height % 6 % 3 (same as old height % 3).
    // scroll_stuck = height % 6 >= 3.
    var combined = imgElems[imgElemIdx].height % 6;
    var cursor = combined % 3;
    if(cursor == 0) {
        var newClassName = "handCursor";
    } else if(cursor == 1) {
        var newClassName = "normalCursor";
    } else {
        var newClassName = "textCursor";
    }

    if(newClassName != imgElemClass[imgElemIdx]) {
        imgElemClass[imgElemIdx] = newClassName;
        imgElems[imgElemIdx].className = newClassName;
    }

    // Decode scroll_stuck from the height signal.
    var stuck = combined >= 3;
    handleScrollStuck(stuck);
}

function postImgLoadHandler(imgLoadIdx) {
    if(shutdown || imgLoadIdx != postImgLoadHandlerSchedIdx) return;

    postImgLoadHandlerSchedIdx = null;

    if(imgLoadIdx >= 3) {
        // iframe signal: width % 2 == 0  (unchanged — % 4 % 2 == % 2 always)
        if(imgElems[imgLoadIdx & 1].width % 2 == 0) {
            loadIframe();
        } else {
            cancelIframeLoad();
        }
    }

    // Navigate signal: width % 4 >= 2 (one-shot, server sets on page load)
    if(imgLoadIdx >= 1 && imgElems[imgLoadIdx & 1].width % 4 >= 2) {
        resetScrollbar();
    }

    updateCursor(imgLoadIdx & 1);
}

function imgLoadHandler(imgElemIdx) {
    if(shutdown || (currentImgLoadIdx & 1) != imgElemIdx) return;

    allowNewEventNotify = false;

    ++currentImgReloadIdx;
    if(imgReloadTimeout) {
        clearTimeout(imgReloadTimeout);
        imgReloadTimeout = null;
    }

    eventQueueStartIdx += imgLoadEventIncrement;
    var oldEventQueue = eventQueue;
    eventQueue = new Array();
    for(var i = imgLoadEventIncrement; i < oldEventQueue.length; ++i) {
        eventQueue[i - imgLoadEventIncrement] = oldEventQueue[i];
    }

    if(postImgLoadHandlerSchedIdx != null) {
        postImgLoadHandler(postImgLoadHandlerSchedIdx);
    }

    updateCursor(currentImgLoadIdx & 1);

    imgElems[currentImgLoadIdx & 1].style.zIndex = 3;
    imgElems[(currentImgLoadIdx & 1) ^ 1].style.zIndex = 2;

    postImgLoadHandlerSchedIdx = currentImgLoadIdx;
    setTimeout("postImgLoadHandler(" + currentImgLoadIdx + ")", 0);

    startImgLoad();
}

// Event handling
var shiftDown = false;
var controlDown = false;
var altDown = false;

var nonCharKeyList = new Array(%-nonCharKeyList-%);
var nonCharKeys = {};
for(var i = 0; i < nonCharKeyList.length; ++i) {
    nonCharKeys[nonCharKeyList[i]] = true;
}

var hackForm;
var hackInput;

var snakeOilKeyCipherKey = new Array();
function pushSnakeOil(a) {
    for(var i = 0; i < a.length; ++i) {
        snakeOilKeyCipherKey[snakeOilKeyCipherKey.length] = a[i];
    }
}
%-snakeOilKeyCipherKeyWrites-%

function encodeKey(key) {
    var i = eventQueueStartIdx + eventQueue.length;
    return key ^ snakeOilKeyCipherKey[i % snakeOilKeyCipherKey.length];
}

function putEvent(event) {
    eventQueue[eventQueue.length] = event;
    if(wsMode && ws && ws.readyState === 1) {
        // Send events immediately over WebSocket
        var msg = '{"type":"events","startIdx":' + eventQueueStartIdx +
                  ',"events":"' + eventQueue.join("/") + '/"}';
        ws.send(msg);
        eventQueueStartIdx += eventQueue.length;
        eventQueue = new Array();
    } else {
        newEventNotify();
    }
}

function updateMousePos(event) {
    mouseX = event.clientX | 0;
    mouseY = event.clientY | 0;
    if(fixMousePosition) {
        mouseX -= 2;
        mouseY -= 2;
    }
}

function preventDefault(event) {
    if(event.preventDefault) {
        event.preventDefault();
    } else {
        event.returnValue = false;
    }
}

function sanitizeModifiers(event, func) {
    if(
        event.shiftKey === false &&
        event.ctrlKey === false &&
        event.altKey === false
    ) {
        if(shiftDown) putEvent("KUP_" + encodeKey(16));
        if(controlDown) putEvent("KUP_" + encodeKey(17));
        if(altDown) putEvent("KUP_" + encodeKey(18));
        shiftDown = false;
        controlDown = false;
        altDown = false;
    }

    var tmpShift = !shiftDown && event.shiftKey === true;
    var tmpControl = !controlDown && event.ctrlKey === true;
    if(tmpShift) putEvent("KDN_" + encodeKey(16));
    if(tmpControl) putEvent("KDN_" + encodeKey(17));

    func();

    if(tmpControl) putEvent("KUP_" + encodeKey(17));
    if(tmpShift) putEvent("KUP_" + encodeKey(16));
}

function registerEventHandlers() {
    imgElems[0].onload = function() { imgLoadHandler(0); };
    imgElems[1].onload = function() { imgLoadHandler(1); };

    window.onresize = function() {
        // The spacer (100000px) exists by now, so document.body.clientHeight is
        // unreliable — it may return the full content height instead of the viewport.
        // Priority: window.innerWidth/Height (always viewport, all modern browsers)
        //   → documentElement.clientWidth/Height (IE 6-8 standards mode)
        //   → document.body.clientWidth/Height (IE 4-5 quirks mode, where body IS viewport)
        var vpW, vpH;
        if(window.innerWidth) {
            // Use documentElement.clientWidth for width: it excludes the
            // vertical scrollbar, so CEF renders content clear of it.
            // window.innerHeight is fine for height (no horizontal scrollbar).
            vpW = (document.documentElement && document.documentElement.clientWidth)
                    ? (document.documentElement.clientWidth | 0)
                    : (window.innerWidth | 0);
            vpH = window.innerHeight | 0;
        } else if(document.documentElement && document.documentElement.clientWidth) {
            vpW = document.documentElement.clientWidth | 0;
            vpH = document.documentElement.clientHeight | 0;
        } else {
            vpW = document.body.clientWidth | 0;
            vpH = document.body.clientHeight | 0;
        }
        if(bodyOverflowHiddenNotSupported) {
            vpW -= 1;
            vpH -= 2;
        }
        lastVpWidth = Math.max(vpW, 1);
        lastVpHeight = Math.max(vpH, 1);
        if(wsMode && ws && ws.readyState === 1) {
            ws.send('{"type":"resize","width":' + lastVpWidth + ',"height":' + lastVpHeight + '}');
        } else {
            newEventNotify();
        }
    };

    document.onmousedown = function(event) {
        if(!event) event = window.event;
        updateMousePos(event);
        var button = event.button | 0;
        if(button >= 0 && button <= 2) {
            if(leftMouseButtonIs1 && button == 1) {
                button = 0;
            }
            sanitizeModifiers(event, function() {
                putEvent("MDN_" + mouseX + "_" + mouseY + "_" + button);
            });
        }
        window.focus();
        preventDefault(event);
    };

    document.onmouseup = function(event) {
        if(!event) event = window.event;
        updateMousePos(event);
        var button = event.button | 0;
        if(button >= 0 && button <= 2) {
            if(leftMouseButtonIs1 && button == 1) {
                button = 0;
            }
            putEvent("MUP_" + mouseX + "_" + mouseY + "_" + button);
        }
        preventDefault(event);
    };

    document.ondblclick = function(event) {
        if(!event) event = window.event;
        updateMousePos(event);
        putEvent("MDBL_" + mouseX + "_" + mouseY);
        preventDefault(event);
    };

    document.onmousemove = function(event) {
        if(!event) event = window.event;
        updateMousePos(event);
        if(!mouseMoved) {
            mouseMoved = true;
            newEventNotify();
        }
    };

    if(useOnDOMMouseScroll) {
        document.addEventListener(
            "DOMMouseScroll",
            function(event) {
                // Stamp this event so onscroll can recognise the Camino
                // duplicate (native scroll + DOMMouseScroll per gesture tick).
                lastDOMMouseScrollTime = new Date().getTime();
                // detail is lines-to-scroll (typically ±3 per notch in Firefox).
                // Multiply by 40 so one notch → ±120 units (platform standard).
                // The old factor of 120 sent ±360 — 3× too fast.
                var delta = -(event.detail | 0) * 40;
                putEvent("MWH_" + mouseX + "_" + mouseY + "_" + delta);
                applyMWHToScrollbar(delta);
                event.preventDefault();
            },
            false
        );
    } else if(useOnMouseWheel) {
        document.onmousewheel = function(event) {
            if(!event) event = window.event;
            var delta = event.wheelDelta | 0;
            putEvent("MWH_" + mouseX + "_" + mouseY + "_" + delta);
            applyMWHToScrollbar(delta);
            if(event.preventDefault) event.preventDefault();
            event.returnValue = false;
        };
    } else {
        document.onwheel = function(event) {
            // Use deltaY proportionally so trackpad inertia feels natural.
            // deltaMode 0 = pixels (trackpad / high-res wheel), 1 = lines, 2 = pages.
            var dy = event.deltaY;
            if(event.deltaMode === 1) dy *= 40;
            if(event.deltaMode === 2) dy *= 800;
            var delta = -Math.round(dy);
            if(!delta) return;
            delta = Math.max(-1200, Math.min(1200, delta));
            putEvent("MWH_" + mouseX + "_" + mouseY + "_" + delta);
            applyMWHToScrollbar(delta);
            if(event.preventDefault) event.preventDefault();
        };
    }

    document.body.onmouseleave = function() {
        putEvent("MOUT_" + mouseX + "_" + mouseY);
    };

    if(useBackspaceCaptureHack) {
        hackForm = document.forms[document.forms.length - 1];
        hackInput = hackForm.elements[0];

        hackForm.onsubmit = function() {
            if(!event) event = window.event;
            preventDefault(event);
        };

        window.onfocus = function() {
            setTimeout("hackInput.focus()", 0);
        };
    } else {
        document.forms[document.forms.length - 1].innerHTML = "";
        window.onblur = function() {
            putEvent("FOUT");
        };
    }

    document.ondragstart = function() {
        return false;
    };

    document.oncontextmenu = function(event) {
        if(!event) event = window.event;
        preventDefault(event);
    };

    document.onkeypress = function(event) {
        if(!event) {
            event = window.event;
            var key = event.keyCode | 0;
        } else {
            var key = event.which | 0;
        }
        if(
            key > 32 &&
            !(controlDown && ((key >= 65 && key <= 90) || (key >= 97 && key <= 122)))
        ) {
            sanitizeModifiers(event, function() {
                putEvent("KPR_" + encodeKey(key));
            });
            preventDefault(event);
        }
        // Space (32) and control-modified letters are not forwarded to CEF
        // here.  Let the browser handle space natively (page scroll) so the
        // local scrollbar moves and onscroll fires.
    };

    document.onkeydown = function(event) {
        if(!event) {
            event = window.event;
            var key = event.keyCode | 0;
        } else {
            var key = event.which | 0;
        }
        if(controlDown && key >= 65 && key <= 90) {
            putEvent("KPR_" + encodeKey(key + 32));
            preventDefault(event);
        } else if(nonCharKeys[key] && key !== 32) {
            if(key == 16) shiftDown = true;
            if(key == 17) controlDown = true;
            if(key == 18) altDown = true;

            sanitizeModifiers(event, function() {
                putEvent("KDN_" + encodeKey(key));
            });

            preventDefault(event);
        }
        // Space (32) is excluded: let the browser handle it natively so
        // the page scrolls, the scrollbar moves, and onscroll fires to
        // relay the scroll to CEF via MWH.
    };

    document.onkeyup = function(event) {
        if(!event) {
            event = window.event;
            var key = event.keyCode | 0;
        } else {
            var key = event.which | 0;
        }
        if(nonCharKeys[key] && key !== 32) {
            if(key == 16) shiftDown = false;
            if(key == 17 || key == 18) {
                controlDown = false;
                altDown = false;
                putEvent("KUP_" + encodeKey(17));
                putEvent("KUP_" + encodeKey(18));
            } else {
                putEvent("KUP_" + encodeKey(key));
            }
            preventDefault(event);
        }
    };

    window.onbeforeunload = function(event) {
        if(shutdown) return;

        shutdown = true;

        if(ws) {
            ws.close();
        }

        imgElems[0].src = "%-pathPrefix-%/close/%-mainIdx-%/";
        imgElems[1].src = "%-pathPrefix-%/close/%-mainIdx-%/";

        var start = new Date().getTime();
        while(new Date().getTime() - start < 50) {}
    };
}

// Entry point
window.onload = function() {
    detectBrowserQuirks();

    imgElems[0] = document.images[0];
    imgElems[1] = document.images[1];

    // Measure viewport BEFORE adding spacer so clientHeight returns
    // the actual viewport, not the content height (100000px).
    lastVpWidth = document.body.clientWidth | 0;
    lastVpHeight = document.body.clientHeight | 0;
    if(lastVpWidth == 0 || lastVpHeight == 0) {
        lastVpWidth = window.innerWidth | 0;
        lastVpHeight = window.innerHeight | 0;
    }
    if(bodyOverflowHiddenNotSupported) {
        lastVpWidth -= 1;
        lastVpHeight -= 2;
    }
    lastVpWidth = Math.max(lastVpWidth, 1);
    lastVpHeight = Math.max(lastVpHeight, 1);

    // Add spacer for native scrollbar only on browsers that support scroll-to.
    // Very old browsers (bodyOverflowHiddenNotSupported) rely on mouse wheel only.
    if(!bodyOverflowHiddenNotSupported) {
        var spacer = document.createElement("div");
        spacer.style.height = "100000px";
        document.body.appendChild(spacer);

        // The vertical scrollbar is now visible.  Remeasure the usable content
        // width — document.documentElement.clientWidth excludes the scrollbar
        // width in all modern browsers (any browser reaching this code path).
        // This stops CEF from rendering content underneath the scrollbar, which
        // previously caused the quality buttons on the right to be covered.
        var usableW = document.documentElement.clientWidth | 0;
        if(usableW > 0 && usableW < lastVpWidth) {
            lastVpWidth = usableW;
        }
    }

    registerEventHandlers();

    // Convert native scrollbar drags to MWH events for CEF.
    // position:absolute images must track scrollY manually via style.top so
    // they stay pinned to the viewport on every browser (including IE 6 which
    // has no position:fixed support).
    if(!bodyOverflowHiddenNotSupported) {
        window.onscroll = function() {
            if(shutdown) return;
            var scrollY = (typeof window.pageYOffset !== "undefined") ? (window.pageYOffset | 0) :
                          ((typeof document.documentElement !== "undefined" && document.documentElement.scrollTop) ? (document.documentElement.scrollTop | 0) :
                          ((typeof document.body !== "undefined" && document.body.scrollTop) ? (document.body.scrollTop | 0) : 0));
            if(scrollbarProgrammatic) {
                // Scroll was initiated by applyMWHToScrollbar or resetScrollbar.
                scrollbarProgrammatic = false;
                scrollbarY = scrollY;
                return;
            }
            var dy = scrollY - scrollbarY;
            if(dy !== 0) {
                // Keep the active rendering layer pinned to viewport top.
                if(wsTileMode) {
                    setTileLayerTop(scrollY);
                } else {
                    imgElems[0].style.top = scrollY + "px";
                    imgElems[1].style.top = scrollY + "px";
                }
                // Multiplier 1: 1 px of scrollbar drag = 1 CEF delta unit.
                // Matches applyMWHToScrollbar's divisor of 1 so all scroll
                // sources are proportional and symmetric.
                // Cap raised to 2400 (only triggers for unrealistically large
                // single drag events — normal use stays linear).
                var delta = (dy > 0 ? -1 : 1) * Math.min(Math.abs(dy), 2400);
                var cx = (lastVpWidth / 2) | 0;
                var cy = (lastVpHeight / 2) | 0;

                if(useOnDOMMouseScroll && Math.abs(dy) < 50 &&
                   (new Date().getTime() - lastDOMMouseScrollTime < 50)) {
                    // Camino trackpad: the native scroll fires before
                    // DOMMouseScroll for the same gesture.  Both would
                    // generate MWH events (double scroll).  Because
                    // DOMMouseScroll fired recently AND the native delta is
                    // small (< 50 px — a trackpad micro-scroll, not a page
                    // jump or drag), we suppress this duplicate.
                    //
                    // Do NOT update scrollbarY.  It must stay at the
                    // scrollTo position from the previous tick's
                    // DOMMouseScroll handler so the next onscroll can
                    // correctly compute the delta.
                    return;
                }

                // Genuine scrollbar drag (no recent DOMMouseScroll) or
                // non-Gecko browser (Chrome, IE, etc.).
                scrollbarY = scrollY;
                putEvent("MWH_" + cx + "_" + cy + "_" + delta);
                // Debounced edge-spring: schedule a spring after 200ms of
                // inactivity.  While the user is still dragging, each
                // onscroll resets the timer so the spring never fires mid-drag.
                // Once the drag stops, the spring re-centres the scrollbar
                // so it never stalls on long pages.
                if(scrollY > 90000 || scrollY < 10000) {
                    if(dragSpringTimeout) clearTimeout(dragSpringTimeout);
                    dragSpringTimeout = setTimeout(function() {
                        if(shutdown) return;
                        dragSpringTimeout = null;
                        scrollbarProgrammatic = true;
                        scrollbarY = 50000;
                        if(wsTileMode) {
                            setTileLayerTop(50000);
                        } else {
                            imgElems[0].style.top = "50000px";
                            imgElems[1].style.top = "50000px";
                        }
                        window.scrollTo(0, 50000);
                    }, 200);
                } else if(dragSpringTimeout) {
                    clearTimeout(dragSpringTimeout);
                    dragSpringTimeout = null;
                }
                if(scrollY === 0) {
                    putEvent("MWH_" + cx + "_" + cy + "_999999");
                }
            }
        };
    }

    // Prevent browser scroll-restoration from putting the scrollbar at a
    // non-zero position after the client browser reloads main.html.
    // history.scrollRestoration stops modern browsers from restoring at all.
    // The delayed scrollTo(0,0) catches browsers that restore *after* onload.
    if(window.history && window.history.scrollRestoration) {
        window.history.scrollRestoration = 'manual';
    }
    if(!bodyOverflowHiddenNotSupported) {
        scrollbarProgrammatic = true;
        scrollbarY = 0;
        imgElems[0].style.top = "0px";
        imgElems[1].style.top = "0px";
        window.scrollTo(0, 0);
        // Second pass after 300 ms to catch browsers that restore scroll
        // asynchronously after window.onload has already returned.
        setTimeout(function() {
            if(shutdown) return;
            scrollbarProgrammatic = true;
            scrollbarY = 0;
            imgElems[0].style.top = "0px";
            imgElems[1].style.top = "0px";
            window.scrollTo(0, 0);
        }, 300);
    }

    // Try WebSocket first for lower-latency image push + event delivery.
    // Falls back to HTTP polling if WebSocket is unavailable or fails.
    tryWebSocket();

    setTimeout(function() {
        if(!wsMode) {
            startImgLoad();
        }
    }, 1000);
};

// WebSocket connection
function tryWebSocket() {
    var proto = (window.location.protocol === 'https:') ? 'wss:' : 'ws:';
    var wsUrl = proto + '//' + window.location.host + '%-pathPrefix-%/ws/';
    try {
        ws = new WebSocket(wsUrl);
        // arraybuffer lets us parse tile binary payloads directly via Uint8Array
        // without an async FileReader.  Full-frame blobs are wrapped on the fly.
        ws.binaryType = 'arraybuffer';

        ws.onopen = function() {
            wsMode = true;
            ws.send('{"type":"resize","width":' + lastVpWidth + ',"height":' + lastVpHeight + '}');
        };

        var pendingTiles = null;   // {count, cursor, iframe} from the text frame

        ws.onmessage = function(evt) {
            if(typeof evt.data === 'string') {
                var msg;
                try { msg = JSON.parse(evt.data); } catch(e) { return; }
                if(msg.type === 'tiles') {
                    // Binary payload follows; remember metadata.
                    pendingTiles = {count: msg.count, cursor: msg.cursor, iframe: msg.iframe, stuck: msg.stuck};
                } else {
                    pendingTiles = null;
                    handleWSControlMessage(evt.data);
                }
            } else {
                // ArrayBuffer — either dirty-tile payload or full-frame JPEG
                if(pendingTiles && pendingTiles.count > 0) {
                    var meta = pendingTiles;
                    pendingTiles = null;
                    handleWSTiles(evt.data, meta.count, meta.cursor, meta.iframe, meta.stuck);
                } else {
                    pendingTiles = null;
                    handleWSImage(evt.data);
                }
            }
        };

        ws.onclose = function() {
            var wasWS = wsMode;
            wsMode = false;
            ws = null;
            if(wasWS && !shutdown) {
                // Lost WebSocket — fall back to HTTP polling
                startImgLoad();
            }
        };

        ws.onerror = function() {
            // Don't touch wsMode here — onclose will fire next and needs
            // to read it to decide whether to fall back to HTTP polling.
        };
    } catch(e) {
        // WebSocket not supported; HTTP polling will start via setTimeout
    }
}

// Full-frame fallback (ArrayBuffer → Blob → img src).
// Used when the server sends a non-tile frame (e.g. initial frame after resize).
function handleWSImage(ab) {
    var blob = new Blob([ab], {type: 'image/jpeg'});
    var url = URL.createObjectURL(blob);

    if(lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
    lastBlobUrl = url;

    // Switch back to full-frame mode if we were in tile mode.
    if(wsTileMode) {
        if(tileLayer) tileLayer.style.display = 'none';
        // Revoke all tile blob URLs to free memory
        for(var key in tileImgs) {
            if(tileImgs[key].url) {
                URL.revokeObjectURL(tileImgs[key].url);
                tileImgs[key].url = null;
            }
        }
    }
    wsTileMode = false;

    // Double-buffering
    wsImgLoadIdx++;
    var idx = wsImgLoadIdx & 1;
    imgElems[idx].src = url;
    imgElems[idx].style.top = scrollbarY + "px";
    imgElems[idx].style.zIndex = 3;
    imgElems[(idx) ^ 1].style.zIndex = 2;

    // Send resize in case viewport changed
    if(ws && ws.readyState === 1) {
        ws.send('{"type":"resize","width":' + lastVpWidth + ',"height":' + lastVpHeight + '}');
    }
}

// Dirty-tile update: apply changed tiles to the tile layer.
function handleWSTiles(ab, count, cursorSignal, iframeSignal, scrollStuck) {
    // First call: create the tile layer if it doesn't exist yet.
    if(!wsTileMode) {
        wsTileMode = true;
        if(!tileLayer) {
            tileLayer = document.createElement('div');
            tileLayer.style.position = 'absolute';
            tileLayer.style.left = '0px';
            tileLayer.style.top  = scrollbarY + 'px';
            tileLayer.style.zIndex = '3';
            document.body.appendChild(tileLayer);
        } else {
            tileLayer.style.display = '';
        }
        // Push full-frame imgs behind the tile layer.
        imgElems[0].style.zIndex = '1';
        imgElems[1].style.zIndex = '1';
    }

    applyTiles(parseTileBinary(ab, count));

    // Cursor signal (encoded on tile frames too).
    var cursorClass =
        cursorSignal === 0 ? 'handCursor' :
        cursorSignal === 1 ? 'normalCursor' : 'textCursor';
    if(cursorClass !== imgElemClass[wsImgLoadIdx & 1]) {
        imgElemClass[wsImgLoadIdx & 1] = cursorClass;
        tileLayer.className = cursorClass;
    }

    if(iframeSignal) loadIframe();

    // Scroll-stuck feedback: CEF hit top or bottom.
    if(scrollStuck) handleScrollStuck(true);
}

function handleWSControlMessage(msgStr) {
    try {
        var msg = JSON.parse(msgStr);
        if(msg.type === 'frame') {
            // Cursor signal
            var cursor = msg.cursor;
            var newClassName;
            if(cursor == 0) newClassName = "handCursor";
            else if(cursor == 1) newClassName = "normalCursor";
            else newClassName = "textCursor";

            var idx = (wsImgLoadIdx + 1) & 1;
            if(newClassName != imgElemClass[idx]) {
                imgElemClass[idx] = newClassName;
                imgElems[idx].className = newClassName;
            }

            // Iframe signal
            if(msg.iframe === true) {
                loadIframe();
            }
        } else if(msg.type === 'iframe') {
            loadIframe();
        } else if(msg.type === 'scroll_reset') {
            resetScrollbar();
        }
    } catch(e) {
        // Ignore malformed control messages
    }
}

</script>

<img>

<form></form>
<form></form>
<form><input></form>
