<html>
<head>
<title>%-programName-%</title>
<meta http-equiv="imagetoolbar" content="no">
<style>
body {
    overflow: hidden;
    margin: 0;
    padding: 0;
}
img {
    position: absolute;
    top: 0px;
    left: 0px;
}
iframe {
    display: none;
    position: absolute;
    z-index: 1;
}
input {
    position: absolute;
    z-index: 1;
    left: -50px;
    top: -50px;
    width: 40px;
    height: 40px;
}
.handCursor {
    cursor: pointer;
    cursor: hand;
}
.normalCursor {
    cursor: default;
}
.textCursor {
    cursor: text;
}
#scrollbar {
    position: absolute;
    right: 0;
    top: 0;
    width: 18px;
    height: 100%;
    z-index: 10;
    background: #e0e0e0;
    border-left: 1px solid #999;
}
#scrollTrack {
    position: absolute;
    right: 3px;
    top: 20px;
    width: 12px;
    bottom: 20px;
    background: #ccc;
    border: 1px solid #999;
    cursor: pointer;
}
#scrollThumb {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 30px;
    background: #aaa;
    border: 1px solid #777;
    cursor: pointer;
}
#scrollUp, #scrollDown {
    position: absolute;
    right: 0;
    width: 18px;
    height: 20px;
    z-index: 11;
    background: #d0d0d0;
    border: 1px solid #999;
    text-align: center;
    font-size: 10px;
    line-height: 20px;
    font-family: sans-serif;
    cursor: pointer;
    cursor: hand;
    color: #333;
    user-select: none;
}
#scrollUp { top: 0; }
#scrollDown { bottom: 0; }
</style>
<script type="text/javascript">

// Configuration constants
var imgLoadRetryInterval = 3000;
var imgLoadMaxRetries = 10;
var minIframeLoadInterval = 2000;
var eventDelay = 10;

// Browser quirks
var useOnDOMMouseScroll = false;
var useOnMouseWheel = false;
var fixMousePosition = false;
var leftMouseButtonIs1 = false;
var bodyOverflowHiddenNotSupported = false;
var useBackspaceCaptureHack = false;

function detectBrowserQuirks() {
    var ua = window.navigator.userAgent.toLowerCase();
    if(ua.indexOf("chrome") != -1 || ua.indexOf("chromium") != -1) {
        useOnMouseWheel = true;
    }
    // Detect Gecko-based browsers: Firefox, RetroZilla, Camino, SeaMonkey, etc.
    if(ua.indexOf("firefox") != -1 || ua.indexOf("gecko") != -1) {
        useOnDOMMouseScroll = true;
    }
    if(ua.indexOf("classilla") != -1) {
        bodyOverflowHiddenNotSupported = true;
    }
    var msie = ua.indexOf("msie ");
    if(msie > 0) {
        var ver = parseInt(ua.substring(msie + 5, ua.indexOf(".", msie)), 10);
        var win16Bit =
            ua.indexOf("windows 3.1") != -1 ||
            ua.indexOf("win16") != -1 ||
            ua.indexOf("windows 16-bit") != -1;
        useOnMouseWheel = true;
        if(ver <= 8) {
            fixMousePosition = true;
            leftMouseButtonIs1 = true;
        }
        if(ver <= 4 || (ver == 5 && win16Bit)) {
            bodyOverflowHiddenNotSupported = true;
            useBackspaceCaptureHack = true;
        }
    }
}

// State variables
var shutdown = false;

var eventQueue = new Array();
var eventQueueStartIdx = 0;

// WebSocket state
var ws = null;
var wsMode = false;
var wsImgLoadIdx = 0;
var lastBlobUrl = null;

var mouseMoved = false;
var mouseX = 0;
var mouseY = 0;

// Iframe loading system
var nextAllowedIframeLoadTime = new Date().getTime();
var nextIframeLoadIdx = 1;
var schedIframeLoadIdx = null;
var iframeLoadTimeout = null;
var iframeElemIdx = 0;

function iframeLoadHandler(iframeLoadIdx) {
    if(shutdown || iframeLoadIdx != schedIframeLoadIdx) return;

    schedIframeLoadIdx = null;

    nextAllowedIframeLoadTime = new Date().getTime() + minIframeLoadInterval;

    ++iframeElemIdx;
    if(iframeElemIdx >= document.forms.length - 1) {
        iframeElemIdx = 0;
    }

    var rand = (1e9 * Math.random()) | 0;
    document.forms[iframeElemIdx].innerHTML =
        "<iframe src=\"%-pathPrefix-%/iframe/%-mainIdx-%/" + rand + "/\"></iframe>";
}

function loadIframe() {
    if(shutdown || schedIframeLoadIdx != null) return;

    schedIframeLoadIdx = nextIframeLoadIdx++;
    iframeLoadTimeout = setTimeout(
        "iframeLoadHandler(" + schedIframeLoadIdx + ")",
        Math.max(nextAllowedIframeLoadTime - new Date().getTime(), 0)
    );
}

function cancelIframeLoad() {
    if(shutdown || schedIframeLoadIdx == null) return;

    schedIframeLoadIdx = null;
    clearTimeout(iframeLoadTimeout);
}

// Image loading loop
var imgElems = new Array();
var imgElemClass = new Array();
imgElemClass[0] = null;
imgElemClass[1] = null;

var currentImgLoadIdx = 0;
var imgReqIdx = 0;
var imgLoadEventIncrement;
var firstImgReqSent;
var imgLoadAttempts;
var currentImgReloadIdx;
var allowNewEventNotify;
var postImgLoadHandlerSchedIdx = null;
var imgReloadTimeout = null;

function scheduleImgReload(imgLoadIdx, delay) {
    if(shutdown || imgLoadIdx != currentImgLoadIdx) return;

    if(imgReloadTimeout) {
        clearTimeout(imgReloadTimeout);
        imgReloadTimeout = null;
    }

    var imgReloadIdx = ++currentImgReloadIdx;
    setTimeout(
        "imgReloadTimeoutComplete(" + imgLoadIdx + ", " + imgReloadIdx + ")",
        delay
    );
}

function newEventNotify() {
    if(shutdown || currentImgLoadIdx == 0 || !allowNewEventNotify) return;
    allowNewEventNotify = false;

    imgLoadAttempts = Math.max(imgLoadAttempts - 1, 0);

    scheduleImgReload(currentImgLoadIdx, eventDelay);
}

function sendImgReq(imgLoadIdx) {
    if(shutdown || imgLoadIdx != currentImgLoadIdx) return;

    if(imgLoadAttempts > imgLoadMaxRetries) {
        document.title = "%-programName-%: Connection lost";
        window.status = "%-programName-%: Connection lost";
        shutdown = true;
        return;
    }
    ++imgLoadAttempts;

    if(mouseMoved) {
        eventQueue[eventQueue.length] = "MMO_" + mouseX + "_" + mouseY;
        mouseMoved = false;
    }

    var width = document.body.clientWidth | 0;
    var height = document.body.clientHeight | 0;
    if(width == 0 || height == 0) {
        width = window.innerWidth | 0;
        height = window.innerHeight | 0;
    }
    if(bodyOverflowHiddenNotSupported) {
        width -= 1;
        height -= 2;
    }
    width = Math.max(width, 1);
    height = Math.max(height, 1);

    var immediate = ((firstImgReqSent || imgReqIdx == 0) ? 1 : 0);
    firstImgReqSent = true;

    var imgPath =
        "%-pathPrefix-%/image/" +
        "%-mainIdx-%/" +
        (++imgReqIdx) + "/" +
        immediate + "/" +
        width + "/" +
        height + "/" +
        eventQueueStartIdx + "/";
    for(var i = 0; i < eventQueue.length; ++i) {
        imgPath += eventQueue[i] + "/";
    }
    imgElems[imgLoadIdx & 1].src = imgPath;

    scheduleImgReload(imgLoadIdx, imgLoadRetryInterval);
}

function imgReloadTimeoutComplete(imgLoadIdx, imgReloadIdx) {
    if(
        shutdown ||
        imgLoadIdx != currentImgLoadIdx ||
        imgReloadIdx != currentImgReloadIdx
    ) return;

    imgReloadTimeout = null;
    sendImgReq(imgLoadIdx);
}

function startImgLoad() {
    if(shutdown) return;

    var imgLoadIdx = ++currentImgLoadIdx;

    imgLoadEventIncrement = eventQueue.length;
    firstImgReqSent = false;
    imgLoadAttempts = 0;
    currentImgReloadIdx = 0;
    allowNewEventNotify = true;

    sendImgReq(imgLoadIdx);
}

function updateCursor(imgElemIdx) {
    if(shutdown) return;

    var cursor = imgElems[imgElemIdx].height % 3;
    if(cursor == 0) {
        var newClassName = "handCursor";
    } else if(cursor == 1) {
        var newClassName = "normalCursor";
    } else {
        var newClassName = "textCursor";
    }

    if(newClassName != imgElemClass[imgElemIdx]) {
        imgElemClass[imgElemIdx] = newClassName;
        imgElems[imgElemIdx].className = newClassName;
    }
}

function postImgLoadHandler(imgLoadIdx) {
    if(shutdown || imgLoadIdx != postImgLoadHandlerSchedIdx) return;

    postImgLoadHandlerSchedIdx = null;

    if(imgLoadIdx >= 3) {
        if(imgElems[imgLoadIdx & 1].width % 2 == 0) {
            loadIframe();
        } else {
            cancelIframeLoad();
        }
    }

    updateCursor(imgLoadIdx & 1);
}

function imgLoadHandler(imgElemIdx) {
    if(shutdown || (currentImgLoadIdx & 1) != imgElemIdx) return;

    allowNewEventNotify = false;

    ++currentImgReloadIdx;
    if(imgReloadTimeout) {
        clearTimeout(imgReloadTimeout);
        imgReloadTimeout = null;
    }

    eventQueueStartIdx += imgLoadEventIncrement;
    var oldEventQueue = eventQueue;
    eventQueue = new Array();
    for(var i = imgLoadEventIncrement; i < oldEventQueue.length; ++i) {
        eventQueue[i - imgLoadEventIncrement] = oldEventQueue[i];
    }

    if(postImgLoadHandlerSchedIdx != null) {
        postImgLoadHandler(postImgLoadHandlerSchedIdx);
    }

    updateCursor(currentImgLoadIdx & 1);

    imgElems[currentImgLoadIdx & 1].style.zIndex = 3;
    imgElems[(currentImgLoadIdx & 1) ^ 1].style.zIndex = 2;

    postImgLoadHandlerSchedIdx = currentImgLoadIdx;
    setTimeout("postImgLoadHandler(" + currentImgLoadIdx + ")", 0);

    startImgLoad();
}

// Event handling
var shiftDown = false;
var controlDown = false;
var altDown = false;

var nonCharKeyList = new Array(%-nonCharKeyList-%);
var nonCharKeys = {};
for(var i = 0; i < nonCharKeyList.length; ++i) {
    nonCharKeys[nonCharKeyList[i]] = true;
}

var hackForm;
var hackInput;

var snakeOilKeyCipherKey = new Array();
function pushSnakeOil(a) {
    for(var i = 0; i < a.length; ++i) {
        snakeOilKeyCipherKey[snakeOilKeyCipherKey.length] = a[i];
    }
}
%-snakeOilKeyCipherKeyWrites-%

function encodeKey(key) {
    var i = eventQueueStartIdx + eventQueue.length;
    return key ^ snakeOilKeyCipherKey[i % snakeOilKeyCipherKey.length];
}

function putEvent(event) {
    eventQueue[eventQueue.length] = event;
    if(wsMode && ws && ws.readyState === 1) {
        // Send events immediately over WebSocket
        var msg = '{"type":"events","startIdx":' + eventQueueStartIdx +
                  ',"events":"' + eventQueue.join("/") + '/"}';
        ws.send(msg);
        eventQueueStartIdx += eventQueue.length;
        eventQueue = new Array();
    } else {
        newEventNotify();
    }
}

function updateMousePos(event) {
    mouseX = event.clientX | 0;
    mouseY = event.clientY | 0;
    if(fixMousePosition) {
        mouseX -= 2;
        mouseY -= 2;
    }
}

function preventDefault(event) {
    if(event.preventDefault) {
        event.preventDefault();
    } else {
        event.returnValue = false;
    }
}

function sanitizeModifiers(event, func) {
    if(
        event.shiftKey === false &&
        event.ctrlKey === false &&
        event.altKey === false
    ) {
        if(shiftDown) putEvent("KUP_" + encodeKey(16));
        if(controlDown) putEvent("KUP_" + encodeKey(17));
        if(altDown) putEvent("KUP_" + encodeKey(18));
        shiftDown = false;
        controlDown = false;
        altDown = false;
    }

    var tmpShift = !shiftDown && event.shiftKey === true;
    var tmpControl = !controlDown && event.ctrlKey === true;
    if(tmpShift) putEvent("KDN_" + encodeKey(16));
    if(tmpControl) putEvent("KDN_" + encodeKey(17));

    func();

    if(tmpControl) putEvent("KUP_" + encodeKey(17));
    if(tmpShift) putEvent("KUP_" + encodeKey(16));
}

function registerEventHandlers() {
    imgElems[0].onload = function() { imgLoadHandler(0); };
    imgElems[1].onload = function() { imgLoadHandler(1); };

    window.onresize = function() {
        if(wsMode && ws && ws.readyState === 1) {
            var w = document.body.clientWidth | 0;
            var h = document.body.clientHeight | 0;
            if(w == 0 || h == 0) {
                w = window.innerWidth | 0;
                h = window.innerHeight | 0;
            }
            ws.send('{"type":"resize","width":' + w + ',"height":' + h + '}');
        } else {
            newEventNotify();
        }
    };

    document.onmousedown = function(event) {
        if(!event) event = window.event;
        updateMousePos(event);
        var button = event.button | 0;
        if(button >= 0 && button <= 2) {
            if(leftMouseButtonIs1 && button == 1) {
                button = 0;
            }
            sanitizeModifiers(event, function() {
                putEvent("MDN_" + mouseX + "_" + mouseY + "_" + button);
            });
        }
        window.focus();
        preventDefault(event);
    };

    document.onmouseup = function(event) {
        if(!event) event = window.event;
        updateMousePos(event);
        var button = event.button | 0;
        if(button >= 0 && button <= 2) {
            if(leftMouseButtonIs1 && button == 1) {
                button = 0;
            }
            putEvent("MUP_" + mouseX + "_" + mouseY + "_" + button);
        }
        preventDefault(event);
    };

    document.ondblclick = function(event) {
        if(!event) event = window.event;
        updateMousePos(event);
        putEvent("MDBL_" + mouseX + "_" + mouseY);
        preventDefault(event);
    };

    document.onmousemove = function(event) {
        if(!event) event = window.event;
        updateMousePos(event);
        if(!mouseMoved) {
            mouseMoved = true;
            newEventNotify();
        }
    };

    // Mouse wheel / scroll event handler
    function handleWheelEvent(event) {
        if(!event) event = window.event;
        var delta = 0;
        // Try wheelDelta first (IE 6+, Chrome, old Opera)
        if(typeof event.wheelDelta !== "undefined") {
            delta = event.wheelDelta | 0;
        }
        // Try detail (Firefox DOMMouseScroll, old Gecko)
        else if(typeof event.detail !== "undefined" && event.detail) {
            delta = -120 * (event.detail | 0);
        }
        // Try deltaY (modern wheel event)
        else if(typeof event.deltaY !== "undefined") {
            if(event.deltaY > 0) delta = -120;
            if(event.deltaY < 0) delta = 120;
        }
        if(delta !== 0) {
            putEvent("MWH_" + mouseX + "_" + mouseY + "_" + delta);
            if(event.preventDefault) {
                event.preventDefault();
            } else {
                event.returnValue = false;
            }
        }
    }

    // Attach wheel events using ALL available methods for maximum compatibility.
    // Multiple handlers are fine — handleWheelEvent is idempotent per event.
    try { document.addEventListener("DOMMouseScroll", handleWheelEvent, false); } catch(e) {}
    try { window.addEventListener("DOMMouseScroll", handleWheelEvent, false); } catch(e) {}
    document.onmousewheel = handleWheelEvent;
    window.onmousewheel = handleWheelEvent;
    try { document.onwheel = handleWheelEvent; } catch(e) {}
    // Direct img element attachment for browsers where document events
    // don't bubble from images
    imgElems[0].onmousewheel = handleWheelEvent;
    imgElems[1].onmousewheel = handleWheelEvent;

    document.body.onmouseleave = function() {
        putEvent("MOUT_" + mouseX + "_" + mouseY);
    };

    if(useBackspaceCaptureHack) {
        hackForm = document.forms[document.forms.length - 1];
        hackInput = hackForm.elements[0];

        hackForm.onsubmit = function() {
            if(!event) event = window.event;
            preventDefault(event);
        };

        window.onfocus = function() {
            setTimeout("hackInput.focus()", 0);
        };
    } else {
        document.forms[document.forms.length - 1].innerHTML = "";
        window.onblur = function() {
            putEvent("FOUT");
        };
    }

    document.ondragstart = function() {
        return false;
    };

    document.oncontextmenu = function(event) {
        if(!event) event = window.event;
        preventDefault(event);
    };

    document.onkeypress = function(event) {
        if(!event) {
            event = window.event;
            var key = event.keyCode | 0;
        } else {
            var key = event.which | 0;
        }
        if(
            key > 32 &&
            !(controlDown && ((key >= 65 && key <= 90) || (key >= 97 && key <= 122)))
        ) {
            sanitizeModifiers(event, function() {
                putEvent("KPR_" + encodeKey(key));
            });
        }
        preventDefault(event);
    };

    document.onkeydown = function(event) {
        if(!event) {
            event = window.event;
            var key = event.keyCode | 0;
        } else {
            var key = event.which | 0;
        }
        if(controlDown && key >= 65 && key <= 90) {
            putEvent("KPR_" + encodeKey(key + 32));
            preventDefault(event);
        } else if(nonCharKeys[key]) {
            if(key == 16) shiftDown = true;
            if(key == 17) controlDown = true;
            if(key == 18) altDown = true;

            sanitizeModifiers(event, function() {
                putEvent("KDN_" + encodeKey(key));
            });

            preventDefault(event);
        }
    };

    document.onkeyup = function(event) {
        if(!event) {
            event = window.event;
            var key = event.keyCode | 0;
        } else {
            var key = event.which | 0;
        }
        if(nonCharKeys[key]) {
            if(key == 16) shiftDown = false;
            if(key == 17 || key == 18) {
                controlDown = false;
                altDown = false;
                putEvent("KUP_" + encodeKey(17));
                putEvent("KUP_" + encodeKey(18));
            } else {
                putEvent("KUP_" + encodeKey(key));
            }
            preventDefault(event);
        }
    };

    window.onbeforeunload = function(event) {
        if(shutdown) return;

        shutdown = true;

        if(ws) {
            ws.close();
        }

        imgElems[0].src = "%-pathPrefix-%/close/%-mainIdx-%/";
        imgElems[1].src = "%-pathPrefix-%/close/%-mainIdx-%/";

        var start = new Date().getTime();
        while(new Date().getTime() - start < 50) {}
    };

    // Scroll button handlers - works on ALL browsers including IE 5 with no mouse wheel
    var scrollRepeatTimer = null;
    var scrollRepeatDir = 0;

    function startScrollRepeat(delta) {
        stopScrollRepeat();
        scrollRepeatDir = delta;
        putEvent("MWH_" + (document.body.clientWidth | 0) + "_" + ((document.body.clientHeight | 0) / 2 | 0) + "_" + delta);
        scrollRepeatTimer = setInterval(function() {
            putEvent("MWH_" + (document.body.clientWidth | 0) + "_" + ((document.body.clientHeight | 0) / 2 | 0) + "_" + scrollRepeatDir);
        }, 100);
    }

    function stopScrollRepeat() {
        if(scrollRepeatTimer) {
            clearInterval(scrollRepeatTimer);
            scrollRepeatTimer = null;
        }
    }

    var scrollUpBtn = document.getElementById("scrollUp");
    var scrollDownBtn = document.getElementById("scrollDown");
    var scrollTrack = document.getElementById("scrollTrack");
    var scrollThumb = document.getElementById("scrollThumb");

    if(scrollUpBtn) {
        scrollUpBtn.onmousedown = function(event) {
            if(event) { event.cancelBubble = true; } else { window.event.cancelBubble = true; }
            startScrollRepeat(120);
        };
        scrollUpBtn.onmouseup = stopScrollRepeat;
        scrollUpBtn.onmouseout = stopScrollRepeat;
    }
    if(scrollDownBtn) {
        scrollDownBtn.onmousedown = function(event) {
            if(event) { event.cancelBubble = true; } else { window.event.cancelBubble = true; }
            startScrollRepeat(-120);
        };
        scrollDownBtn.onmouseup = stopScrollRepeat;
        scrollDownBtn.onmouseout = stopScrollRepeat;
    }

    // Click on track to jump-scroll
    if(scrollTrack) {
        scrollTrack.onclick = function(event) {
            if(!event) event = window.event;
            // Click in upper half = page up, lower half = page down
            var trackHeight = scrollTrack.offsetHeight || 100;
            var clickY = (event.offsetY != null) ? event.offsetY :
                         ((event.clientY || 0) - (scrollTrack.offsetTop || 0));
            var delta = (clickY < trackHeight / 2) ? 1200 : -1200;
            putEvent("MWH_" + (document.body.clientWidth | 0) + "_" + ((document.body.clientHeight | 0) / 2 | 0) + "_" + delta);
        };
    }

    // Drag scrollbar thumb to scroll
    var thumbDragging = false;
    var thumbStartY = 0;
    var savedOnMouseMove = document.onmousemove;
    var savedOnMouseUp = document.onmouseup;

    if(scrollThumb) {
        scrollThumb.onmousedown = function(event) {
            if(!event) event = window.event;
            thumbDragging = true;
            thumbStartY = (event.clientY || 0);
            if(event.preventDefault) event.preventDefault();
            else event.returnValue = false;
            return false;
        };
    }

    // Wrap existing onmousemove/onmouseup to also handle thumb drag
    document.onmousemove = function(event) {
        if(thumbDragging) {
            if(!event) event = window.event;
            var dy = (event.clientY || 0) - thumbStartY;
            if(Math.abs(dy) > 5) {
                var delta = (dy > 0) ? -360 : 360;
                putEvent("MWH_" + (document.body.clientWidth | 0) + "_" + ((document.body.clientHeight | 0) / 2 | 0) + "_" + delta);
                thumbStartY = (event.clientY || 0);
            }
            return;
        }
        if(savedOnMouseMove) savedOnMouseMove(event);
    };

    document.onmouseup = function(event) {
        if(thumbDragging) {
            thumbDragging = false;
            return;
        }
        if(savedOnMouseUp) savedOnMouseUp(event);
    };
}

// Entry point
window.onload = function() {
    detectBrowserQuirks();

    imgElems[0] = document.images[0];
    imgElems[1] = document.images[1];

    registerEventHandlers();

    // Try WebSocket first; fall back to HTTP polling
    tryWebSocket();

    // Safety net: if WebSocket doesn't connect within 1s, start HTTP polling
    setTimeout(function() {
        if(!wsMode) {
            startImgLoad();
        }
    }, 1000);
};

// WebSocket connection
function tryWebSocket() {
    var proto = (window.location.protocol === 'https:') ? 'wss:' : 'ws:';
    var wsUrl = proto + '//' + window.location.host + '%-pathPrefix-%/ws/';
    try {
        ws = new WebSocket(wsUrl);
        ws.binaryType = 'blob';

        ws.onopen = function() {
            wsMode = true;
            // Send initial resize
            var w = document.body.clientWidth | 0;
            var h = document.body.clientHeight | 0;
            if(w == 0 || h == 0) {
                w = window.innerWidth | 0;
                h = window.innerHeight | 0;
            }
            ws.send('{"type":"resize","width":' + w + ',"height":' + h + '}');
        };

        ws.onmessage = function(evt) {
            if(typeof evt.data === 'string') {
                handleWSControlMessage(evt.data);
            } else {
                handleWSImage(evt.data);
            }
        };

        ws.onclose = function() {
            var wasWS = wsMode;
            wsMode = false;
            ws = null;
            if(wasWS && !shutdown) {
                // Lost WebSocket — fall back to HTTP polling
                startImgLoad();
            }
        };

        ws.onerror = function() {
            wsMode = false;
            // onclose will fire after onerror
        };
    } catch(e) {
        // WebSocket not supported; HTTP polling will start via setTimeout
    }
}

function handleWSImage(blob) {
    var url = URL.createObjectURL(blob);

    // Revoke previous blob to prevent memory leak
    if(lastBlobUrl) {
        URL.revokeObjectURL(lastBlobUrl);
    }
    lastBlobUrl = url;

    // Double-buffering
    wsImgLoadIdx++;
    var idx = wsImgLoadIdx & 1;
    imgElems[idx].src = url;
    imgElems[idx].style.zIndex = 3;
    imgElems[(idx) ^ 1].style.zIndex = 2;

    // Send resize in case viewport changed
    var w = document.body.clientWidth | 0;
    var h = document.body.clientHeight | 0;
    if(w == 0 || h == 0) {
        w = window.innerWidth | 0;
        h = window.innerHeight | 0;
    }
    if(ws && ws.readyState === 1) {
        ws.send('{"type":"resize","width":' + w + ',"height":' + h + '}');
    }
}

function handleWSControlMessage(msgStr) {
    try {
        var msg = JSON.parse(msgStr);
        if(msg.type === 'frame') {
            // Cursor signal
            var cursor = msg.cursor;
            var newClassName;
            if(cursor == 0) newClassName = "handCursor";
            else if(cursor == 1) newClassName = "normalCursor";
            else newClassName = "textCursor";

            var idx = wsImgLoadIdx & 1;
            if(newClassName != imgElemClass[idx]) {
                imgElemClass[idx] = newClassName;
                imgElems[idx].className = newClassName;
            }

            // Iframe signal
            if(msg.iframe === true) {
                loadIframe();
            }
        } else if(msg.type === 'iframe') {
            loadIframe();
        }
    } catch(e) {
        // Ignore malformed control messages
    }
}

</script>
